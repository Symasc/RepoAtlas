# Test coverage gate.
#
# The threshold itself lives in `pyproject.toml` under `[tool.coverage.report]`,
# not here, so `uv run pytest --cov` locally enforces exactly what CI enforces.
# A gate you can only evaluate by pushing is a gate people learn to ignore.
name: coverage

on:
  push:
    branches: [master, v1-the-base]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow reads the tree and writes a job summary.
permissions:
  contents: read

# A superseded push has nothing to tell us; cancel it rather than queue it.
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The oldest Python RepoAtlas supports and the one it is developed on: the two
    # ends of `requires-python`, each with its own standard library to break on.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned to an exact tag: astral-sh publishes no moving `v10` major
        # ref, so `@v10` does not resolve.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Pinned minors, so a new release does not silently change what is
          # being tested.
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        # `--locked` fails rather than silently resolving something other than
        # `uv.lock`. CI must test the dependency set the lockfile describes.
        run: uv sync --locked

      - name: Run tests with coverage
        # `slow` (network / model download) and `scale` are deselected by the
        # `addopts` in pyproject.toml. Coverage is measured over the suite that
        # actually runs on every change, so the number means what it says.
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Write coverage summary
        # Runs even when the gate failed — that is precisely when the table is
        # worth reading.
        if: always()
        run: |
          {
            echo '## Coverage (Python ${{ matrix.python-version }})'
            echo
            echo '```'
            uv run coverage report --skip-covered || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14
