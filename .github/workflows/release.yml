# Release: a version tag (v0.1.0, v0.2.0rc1, …) tests, builds, smoke-tests and publishes.
#
#   test     the checks and the suites, Python's and the explorer's, on the tagged commit
#   build    the tag must name the version pyproject and `repoatlas.__version__` state;
#            export the explorer into the package (so an installation needs no Node),
#            build the wheel and the sdist, and smoke-test each as installed
#   publish  upload to PyPI by Trusted Publishing: no stored token; PyPI trusts this
#            workflow in the `pypi` environment (docs/releasing.md)
#   release  a GitHub release for the tag, with both files attached
#
# Only `publish` can mint a PyPI credential (`id-token: write`), and it runs no code
# from the repository: it downloads what `build` made and uploads it. Actions are
# pinned to commits, not tags, because this workflow publishes.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

permissions:
  contents: read

# Never two releases of one tag at once; never cancel one halfway through publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          # No cache in a release: what is published is built from a clean resolve.
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and types
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright

      - name: Tests
        run: uv run pytest

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # pnpm is the version frontend/package.json names, through Node's corepack.
      # `check` includes `dto:check`, which reads the contract from .venv (above).
      - name: Explorer checks and tests
        working-directory: frontend
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm check

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: false

      - name: The tag names the version being released
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          package="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' repoatlas/__init__.py)"
          if [ "$tag" != "$project" ] || [ "$tag" != "$package" ]; then
            echo "::error::tag $GITHUB_REF_NAME, pyproject.toml $project, repoatlas.__version__ $package: they must agree"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Export the explorer
        working-directory: frontend
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build:static

      # Where `repoatlas ui` looks for it, and where pyproject names it as an artifact.
      - name: Put the explorer in the package
        run: |
          rm -rf repoatlas/ui/explorer
          cp -r frontend/out repoatlas/ui/explorer
          test -f repoatlas/ui/explorer/index.html

      - name: Build
        run: uv build

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --python 3.13 --with dist/*.whl tests/packaging/release_smoke.py "${GITHUB_REF_NAME#v}"

      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --python 3.13 --with dist/*.tar.gz tests/packaging/release_smoke.py "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/symasc-repoatlas/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Attestations (PEP 740)
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *rc* | *a[0-9]* | *b[0-9]*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $prerelease
