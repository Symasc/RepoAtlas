# RepoAtlas deployment (V1_SPEC §18).
#
# One service. RepoAtlas is a deterministic index and an MCP server: it reads
# repositories, writes an index and answers an agent. It runs no model of its
# own, so there is no model container to depend on, no endpoint to configure and
# nothing to pull before the stack works. An agent that reasons over this lives
# outside the stack and connects over `repoatlas mcp`.
#
# Two invariants this file exists to enforce:
#   1. Repositories are mounted **read-only**. V1 never writes to a repository,
#      and the mount makes that a property of the deployment rather than a
#      promise made by the code.
#   2. RepoAtlas state lives in a **separate volume**, so the index, the config
#      and the embedding cache are never written into the mounted tree.
#
# No SearXNG or other research infrastructure: that is V2 (V1_SPEC §22).

services:
  repoatlas:
    build:
      context: .
      dockerfile: Dockerfile
    image: repoatlas:v1
    volumes:
      # The repositories under inspection. REPOS_DIR defaults to ./repos.
      - type: bind
        source: ${REPOS_DIR:-./repos}
        target: /repos
        read_only: true
      # Index, config and embedding-model cache. Deliberately not a bind mount
      # into the source tree.
      - repoatlas-state:/state
    working_dir: /repos
    # Untrusted input, static analysis only (V1_SPEC §17): nothing here needs to
    # gain privileges, and the only writable path is the state volume.
    read_only: true
    tmpfs:
      # The only writable paths besides the state volume. /home is needed because
      # ONNX Runtime wants a scratch directory on import; without it every command
      # opens with a telemetry warning about a read-only home.
      - /tmp
      - /home/repoatlas
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # An interactive tool, not a daemon: `docker compose run --rm repoatlas ...`.
    stdin_open: true
    tty: true

volumes:
  repoatlas-state:
