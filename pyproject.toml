[project]
# The distribution is `symasc-repoatlas`: `repoatlas` on PyPI is another project's.
# The import package and the command stay `repoatlas`.
name = "symasc-repoatlas"
version = "0.1.0"
description = "Local multi-repository engineering intelligence system"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AbdelrahmanSayed" }]
keywords = ["code-intelligence", "mcp", "repositories", "static-analysis", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

dependencies = [
    "typer>=0.15",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    # The parser core is pinned exactly, for the same reason the grammars below
    # are. The pinned JavaScript and Bash grammars are ABI 15, which a core older
    # than 0.25 cannot load at all, so a `>=` range let an ordinary `pip install`
    # resolve a core in which those two languages silently degraded to "parser
    # grammar unavailable" --- the very failure OFF-01 exists to remove. 0.26.0
    # is the core this release characterised its parser output against, so an
    # ordinary installation gets the core the facts were characterised with.
    # Changing it is a parser change, not a resolver accident: re-characterise
    # output and bump the affected parser versions wherever observable facts move.
    "tree-sitter==0.26.0",
    # Grammars are installed artifacts, pinned exactly, and never fetched while
    # indexing (OFF-01). Each is the tree-sitter organisation's own upstream-built
    # wheel, so the network boundary is package installation and nothing later.
    # The pins are exact because a grammar is parser behaviour: a different
    # version is a different set of facts from the same file, with no parser
    # version bump to invalidate the old ones. `repoatlas/parsers/grammars.py`
    # records the same versions with their provenance, refuses any other at load
    # time, and says why there is deliberately no Ruby grammar — and therefore no
    # Ruby structural parser — and what a release carrying the fix would have to
    # be.
    "tree-sitter-bash==0.25.1",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    # The official Model Context Protocol SDK, for the stdio transport adapter
    # only. Pinned below 2.0: that line swaps `httpx` for a second HTTP client
    # (`httpx2`) and adds an OpenTelemetry dependency, neither of which a local
    # stdio adapter needs.
    #
    # RepoAtlas itself declares no HTTP client. It had one --- `httpx`, for the
    # embedded reasoner's model server --- and nothing first-party imports one
    # now. The SDK still installs `httpx` transitively, and an installed HTTP
    # library is not network use: on stdio nothing opens a connection.
    "mcp>=1.30,<2",
    # `tomllib` arrived in 3.11; on 3.10 it is `tomli`, the project it was taken
    # from (`repoatlas/compat.py`). Pinned exactly for the grammars' reason: it
    # reads `pyproject.toml` and the TOML lockfiles into facts, so a different
    # version is a different parser.
    "tomli==2.4.1; python_version < '3.11'",
    "graphql-core==3.2.6",
]

[project.urls]
Homepage = "https://github.com/Symasc/RepoAtlas"
Repository = "https://github.com/Symasc/RepoAtlas"
Issues = "https://github.com/Symasc/RepoAtlas/issues"

[project.scripts]
repoatlas = "repoatlas.cli.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "pyright>=1.1.390",
    "pytest-xdist>=3.8",
    # Pyright checks as 3.10 (below), so it reads `repoatlas/compat.py`'s `import tomli`
    # on every Python; the runtime dependency is 3.10's only.
    "tomli==2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The graph explorer, exported as files (`pnpm build:static` in frontend/), so an
# installed RepoAtlas serves it with no Node. The release workflow stages the export
# here before building. Git ignores the directory, since it is build output, so it
# is named as an artifact, and the sdist carries it so a wheel built from the sdist
# has it too. A build without it is a RepoAtlas without the explorer, and
# `repoatlas ui` says so.
[tool.hatch.build]
artifacts = ["/repoatlas/ui/explorer/**"]

[tool.hatch.build.targets.wheel]
packages = ["repoatlas"]

# The canonical agent skill lives at the repository root, where it is
# vendor-neutral and discoverable, and it is mapped into the installed package so
# that `pip install repoatlas` ships it too. Mapped rather than copied: two
# manually maintained copies of behavioural guidance is exactly how the guidance
# comes to disagree with itself. The sdist picks the directory up as source.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "repoatlas/skills"
# Provenance of the grammars an installation pulls in (OFF-01). The grammar
# wheels carry their own licenses; this makes the pins, commits and hashes
# readable from an installed RepoAtlas without the source tree.
"THIRD_PARTY_NOTICES.md" = "repoatlas/THIRD_PARTY_NOTICES.md"

# The adversarial suite proves that a file named like a private key is never read,
# and the only honest way to prove it is with files named like private keys. Those
# fixtures are fake --- each carries a sentinel where a secret would be --- and
# they belong in the checkout, where they do their job.
#
# They do not belong in a published artifact. A source distribution is scanned,
# mirrored and unpacked by tooling that reads a filename before it reads a
# sentinel, so shipping `id_rsa` and `secret.pem` means shipping a permanent false
# positive to everyone downstream, plus the small chance that someone believes it.
# The wheel never carried them; only the sdist did, because hatchling includes the
# tree by default (RC audit, RCA-04).
#
# Excluded by shape rather than by listing today's files, so a new fixture of the
# same kind is excluded when it is added rather than when someone remembers. The
# checkout is untouched: this is artifact hygiene, and weakening the adversarial
# coverage to quiet a scanner would trade a real guarantee for a cosmetic one.
[tool.hatch.build.targets.sdist]
exclude = [
  "tests/**/fixtures/**/.env",
  "tests/**/fixtures/**/.env.*",
  "tests/**/fixtures/**/id_rsa",
  "tests/**/fixtures/**/id_dsa",
  "tests/**/fixtures/**/id_ecdsa",
  "tests/**/fixtures/**/id_ed25519",
  "tests/**/fixtures/**/*.pem",
  "tests/**/fixtures/**/*.key",
  "tests/**/fixtures/**/*.p12",
  "tests/**/fixtures/**/*.pfx",
  "tests/**/fixtures/**/.netrc",
  "tests/**/fixtures/**/.pgpass",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["repoatlas", "tests"]
# Fixture repositories are sample content, not project code, and some of it is
# deliberately unparseable (invalid UTF-8, truncated YAML). A parse error is not
# suppressible by a per-file ignore, so they are excluded outright.
extend-exclude = [
    "tests/fixtures/repos",
    "tests/fixtures/http",
    "tests/adversarial/fixtures/repos",
]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM",              # simplify
    "RUF",              # ruff-specific
    "PTH",              # prefer pathlib
    "S",                # bandit (security; repositories are untrusted input)
    "TID",              # tidy imports
]
ignore = [
    "S101",   # assert — used extensively and legitimately in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S603", "S607"]          # tests invoke git deliberately
"tests/fixtures/repos/*" = ["ALL"]    # fixture content is sample code, not project code
"tests/fixtures/http/*" = ["ALL"]     # likewise: HTTP linkage scenario repositories
# Confusable characters are this suite's subject, not a mistake in it: the
# supplementary-plane round-trip case needs codepoints that look like ASCII.
"tests/adversarial/test_unicode_exact_retrieval.py" = ["RUF001", "RUF002", "RUF003"]
"tests/adversarial/fixtures/repos/*" = ["ALL"]

[tool.pyright]
include = ["repoatlas", "tests"]
exclude = ["tests/fixtures/repos", "tests/fixtures/http", "tests/adversarial/fixtures/repos"]
# Point Pyright at the project environment. Without this it looks for `python`
# on PATH -- it ignores VIRTUAL_ENV entirely -- so a bare `pyright` run resolved
# the *system* interpreter and reported 95 unresolved-import errors for
# dependencies that are installed, while `uv run pyright` reported none purely
# because `uv run` prepends `.venv/bin` to PATH. Two commands, two answers, and
# the wrong one was the shorter to type.
#
# `venvPath` is resolved relative to this file, so the setting is relocatable
# and contains no host path; naming the directory rather than an executable
# keeps it correct on Windows, where the interpreter is `.venv\Scripts\python.exe`.
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel by default, one worker per core (pytest-xdist). `loadfile` keeps each
# file on one worker, so module-scoped fixtures are built once. `-n 0` runs serially,
# which is handy for one test under a debugger. No test asserts wall-clock time:
# a bound a loaded machine can cross is a flake under parallel load.
addopts = "-q --strict-markers -m 'not slow and not scale' -n auto --dist loadfile"
markers = [
    "slow: a long-running check, such as indexing from a freshly installed wheel; deselected by default",
    "adversarial: adversarial validation; runs by default, selectable with -m adversarial",
    "scale: builds a large synthetic tree; deselected by default",
]

[tool.coverage.run]
source = ["repoatlas"]
# Branch coverage, not just statements: a `if not contained: skip` whose false
# arm is never taken is exactly the kind of gap a security control cannot
# afford, and statement coverage reports it as covered.
branch = true

[tool.coverage.report]
# The gate. It lives here rather than in the workflow so that
# `uv run pytest --cov` locally enforces precisely what CI enforces.
fail_under = 80
show_missing = true
exclude_also = [
    # Type-checking-only imports never execute at runtime.
    "if TYPE_CHECKING:",
    # Protocol and abstract declarations are signatures, not behaviour.
    "^\\s*\\.\\.\\.$",
    "raise NotImplementedError",
]
